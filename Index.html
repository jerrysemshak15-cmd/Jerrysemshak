<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jerry World Translator</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:15px}.c{max-width:480px;margin:0 auto}.h{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:20px;padding:18px;text-align:center;margin-bottom:18px}.h h1{color:#fff;font-size:18px;font-weight:800}.h p{color:rgba(255,255,255,.8);font-size:12px;margin-top:5px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 15px 35px rgba(0,0,0,.2)}.r{display:flex;gap:8px;align-items:center;margin-bottom:12px}select{flex:1;padding:12px;border:2px solid #eee;border-radius:12px;font-weight:600;background:#f9f9ff}button.swap{width:42px;height:42px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border-radius:50%;font-size:18px}textarea{width:100%;min-height:110px;padding:12px;border:2px solid #eee;border-radius:14px;font-size:15px;outline:none}.out{background:#f7f7ff;border-radius:14px;padding:14px;min-height:100px;margin-top:12px;white-space:pre-wrap}#go{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:16px;font-weight:700;margin-top:12px}.s{flex:1;padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:13px;font-weight:600}.f{text-align:center;color:rgba(255,255,255,.6);font-size:11px;margin-top:12px}</style></head><body><div class="c"><div class="h"><h1>JERRY WORLD TRANSLATOR APP</h1><p>100+ Languages • Built by Jerry (16) • Jalingo</p></div><div class="card"><div class="r"><select id="f"></select><button class="swap" id="sw">⇄</button><select id="t"></select></div><textarea id="i" placeholder="Type text here... e.g Hello world"></textarea><button id="go">🌐 Translate Now</button><div class="out" id="o">Translation go show here...</div><div style="display:flex;gap:8px;margin-top:10px"><button class="s" id="cp">📋 Copy</button><button class="s" id="cl">🗑️ Clear</button></div></div><div class="f">Add to Home Screen to install like app</div></div><script>
langs=[["en","English"],["yo","Yoruba"],["ha","Hausa"],["ig","Igbo"],["fr","French"],["es","Spanish"],["de","German"],["ar","Arabic"],["zh","Chinese"],["ja","Japanese"],["ko","Korean"],["pt","Portuguese"],["it","Italian"],["ru","Russian"],["sw","Swahili"],["af","Afrikaans"],["zu","Zulu"],["hi","Hindi"],["tr","Turkish"],["nl","Dutch"]];f=document.getElementById('f');t=document.getElementById('t');langs.forEach(l=>{a=document.createElement('option');a.value=l[0];a.textContent=l[1];f.appendChild(a);b=document.createElement('option');b.value=l[0];b.textContent=l[1];t.appendChild(b)});f.value='en';t.value='yo';async function tr(){x=document.getElementById('i').value.trim();if(!x){alert('Type something!');return;}o=document.getElementById('o');o.textContent='Translating...';try{r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${f.value}&tl=${t.value}&dt=t&q=${encodeURIComponent(x)}`);d=await r.json();o.textContent=d[0].map(v=>v[0]).join('')}catch(e){o.textContent='Check internet and try again'}}document.getElementById('go').onclick=tr;document.getElementById('sw').onclick=()=>{v=f.value;f.value=t.value;t.value=v};document.getElementById('cp').onclick=()=>{navigator.clipboard.writeText(document.getElementById('o').textContent);alert('Copied!')};document.getElementById('cl').onclick=()=>{document.getElementById('i').value='';document.getElementById('o').textContent='Translation go show here...'}
</script></body></html>
