<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jerry World Translator App</title>
<meta name="theme-color" content="#667eea">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:15px}
.container{max-width:480px;margin:0 auto}
.header{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);border-radius:20px;padding:18px;text-align:center;margin-bottom:18px}
.header h1{color:white;font-size:18px;font-weight:800;letter-spacing:1px}
.header p{color:rgba(255,255,255,0.85);font-size:12px;margin-top:5px}
.card{background:white;border-radius:20px;padding:18px;box-shadow:0 15px 35px rgba(0,0,0,0.2)}
.lang-row{display:flex;gap:10px;align-items:center;margin-bottom:12px}
select{flex:1;padding:12px;border:2px solid #eee;border-radius:12px;font-weight:600;background:#f9f9ff;font-size:14px}
.swap{width:42px;height:42px;border:none;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border-radius:50%;font-size:18px;cursor:pointer}
textarea{width:100%;min-height:120px;padding:14px;border:2px solid #eee;border-radius:14px;font-size:15px;outline:none}
textarea:focus{border-color:#667eea}
.output{background:#f7f7ff;border-radius:14px;padding:14px;min-height:120px;margin-top:14px}
#outputText{font-size:15px;color:#333;white-space:pre-wrap}
.btn{width:100%;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;font-size:16px;font-weight:700;margin-top:14px;cursor:pointer}
.small-btn{flex:1;padding:10px;border:1px solid #ddd;border-radius:10px;background:white;font-size:13px;font-weight:600;cursor:pointer}
.footer{text-align:center;color:rgba(255,255,255,0.7);font-size:11px;margin-top:15px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>JERRY WORLD TRANSLATOR APP</h1>
<p>Translate 100+ Languages • Built by Jerry (16)</p>
</div>
<div class="card">
<div class="lang-row">
<select id="fromLang"></select>
<button class="swap" id="swapBtn">⇄</button>
<select id="toLang"></select>
</div>
<textarea id="inputText" placeholder="Type text here... E.g Hello world"></textarea>
<button class="btn" id="translateBtn">🌐 Translate Now</button>
<div class="output"><div id="outputText">Translation go show here...</div></div>
<div style="display:flex;gap:10px;margin-top:10px">
<button class="small-btn" id="copyBtn">📋 Copy</button>
<button class="small-btn" id="clearBtn">🗑️ Clear</button>
</div>
</div>
<div class="footer">Built from Boarding School • Jalingo, Taraba • Add to Home Screen to install</div>
</div>
<script>
const fullLangs=[["af","Afrikaans"],["sq","Albanian"],["am","Amharic"],["ar","Arabic"],["hy","Armenian"],["az","Azerbaijani"],["eu","Basque"],["be","Belarusian"],["bn","Bengali"],["bs","Bosnian"],["bg","Bulgarian"],["ca","Catalan"],["ceb","Cebuano"],["ny","Chichewa"],["zh","Chinese"],["co","Corsican"],["hr","Croatian"],["cs","Czech"],["da","Danish"],["nl","Dutch"],["en","English"],["eo","Esperanto"],["et","Estonian"],["tl","Filipino"],["fi","Finnish"],["fr","French"],["fy","Frisian"],["gl","Galician"],["ka","Georgian"],["de","German"],["el","Greek"],["gu","Gujarati"],["ht","Haitian Creole"],["ha","Hausa"],["haw","Hawaiian"],["he","Hebrew"],["hi","Hindi"],["hmn","Hmong"],["hu","Hungarian"],["is","Icelandic"],["ig","Igbo"],["id","Indonesian"],["ga","Irish"],["it","Italian"],["ja","Japanese"],["jw","Javanese"],["kn","Kannada"],["kk","Kazakh"],["km","Khmer"],["ko","Korean"],["ku","Kurdish"],["ky","Kyrgyz"],["lo","Lao"],["la","Latin"],["lv","Latvian"],["lt","Lithuanian"],["lb","Luxembourgish"],["mk","Macedonian"],["mg","Malagasy"],["ms","Malay"],["ml","Malayalam"],["mt","Maltese"],["mi","Maori"],["mr","Marathi"],["mn","Mongolian"],["my","Myanmar"],["ne","Nepali"],["no","Norwegian"],["or","Odia"],["ps","Pashto"],["fa","Persian"],["pl","Polish"],["pt","Portuguese"],["pa","Punjabi"],["ro","Romanian"],["ru","Russian"],["sm","Samoan"],["gd","Scots Gaelic"],["sr","Serbian"],["st","Sesotho"],["sn","Shona"],["sd","Sindhi"],["si","Sinhala"],["sk","Slovak"],["sl","Slovenian"],["so","Somali"],["es","Spanish"],["su","Sundanese"],["sw","Swahili"],["sv","Swedish"],["tg","Tajik"],["ta","Tamil"],["te","Telugu"],["th","Thai"],["tr","Turkish"],["uk","Ukrainian"],["ur","Urdu"],["ug","Uyghur"],["uz","Uzbek"],["vi","Vietnamese"],["cy","Welsh"],["xh","Xhosa"],["yi","Yiddish"],["yo","Yoruba"],["zu","Zulu"]];
const fromSel=document.getElementById('fromLang');const toSel=document.getElementById('toLang');
fullLangs.forEach(l=>{let o1=document.createElement('option');o1.value=l[0];o1.textContent=l[1];fromSel.appendChild(o1);let o2=document.createElement('option');o2.value=l[0];o2.textContent=l[1];toSel.appendChild(o2);});
fromSel.value='en';toSel.value='yo';
async function doTranslate(){
const text=document.getElementById('inputText').value.trim();
const from=fromSel.value;const to=toSel.value;
if(!text){alert('Type something first!');return;}
const out=document.getElementById('outputText');out.textContent='Translating...';
try{
const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${from}&tl=${to}&dt=t&q=${encodeURIComponent(text)}`;
const res=await fetch(url);const data=await res.json();
out.textContent=data[0].map(x=>x[0]).join('');
}catch(e){out.textContent='Network error. Check internet and try again.';}
}
document.getElementById('translateBtn').onclick=doTranslate;
document.getElementById('swapBtn').onclick=()=>{let a=fromSel.value;fromSel.value=toSel.value;toSel.value=a;};
document.getElementById('copyBtn').onclick=()=>{navigator.clipboard.writeText(document.getElementById('outputText').textContent);alert('Copied!');};
document.getElementById('clearBtn').onclick=()=>{document.getElementById('inputText').value='';document.getElementById('outputText').textContent='Translation go show here...';};
</script>
</body>
</html>
